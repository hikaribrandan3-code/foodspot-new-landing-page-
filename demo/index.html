<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Menú</title>
<meta name="description" content="Mirá el menú y hacé tu pedido por WhatsApp.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">

<!-- Item photos come from a CDN; warm the connection before the grid paints -->
<link rel="preconnect" href="https://images.unsplash.com" crossorigin>
</head>
<body>

<!-- ══════════ HEADER (logo or cover) ══════════ -->
<header class="mh" id="mh"></header>

<!-- ══════════ MENU TAB ══════════ -->
<main class="tab" id="tab-menu">
  <!-- sticky category rail -->
  <div class="rail" id="rail"></div>
  <div class="grid-wrap" id="grid"></div>
  <p class="powered">
    Menú por <a href="https://foodspotmobile.com" target="_blank" rel="noopener">FoodSpot Mobile</a>
  </p>
</main>

<!-- ══════════ INFO TAB ══════════ -->
<main class="tab" id="tab-info" hidden></main>

<!-- ══════════ CART STRIP ══════════ -->
<div class="cart" id="cart" hidden>
  <span class="cart-label">Tu pedido</span>
  <div class="cart-lines" id="cart-lines"></div>
  <div class="cart-total"><span>Total</span><span id="cart-total"></span></div>
  <button class="btn btn-primary" id="cart-go">Hacer pedido</button>
</div>

<!-- ══════════ BOTTOM NAV — Menú · Cámara · Info ══════════ -->
<nav class="nav" id="nav" aria-label="Navegación">
  <button class="nav-item active" id="nav-menu" aria-current="page">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h11"/></svg>
    <span>Menú</span>
  </button>

  <a class="nav-cam" id="nav-cam" aria-label="Abrir la cámara">
    <span class="nav-cam-inner">
      <svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l1.6-2h6.8L17 7h3v13H4z"/><circle cx="12" cy="13" r="3.6"/></svg>
    </span>
  </a>

  <button class="nav-item" id="nav-info">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5h.01"/></svg>
    <span>Info</span>
  </button>
</nav>

<!-- ══════════ ITEM SHEET ══════════ -->
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="item-sheet" hidden aria-modal="true" role="dialog"></section>

<!-- ══════════ ORDER SHEET ══════════ -->
<section class="sheet sheet-tall" id="order-sheet" hidden aria-modal="true" role="dialog"></section>

<!-- ══════════ HANDOFF ══════════ -->
<section class="sheet" id="sent-sheet" hidden aria-modal="true" role="dialog"></section>

<script src="menu.js"></script>
<script src="app.js"></script>
</body>
</html>
