<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="description" content="FoodSpot Mobile — The Shopify alternative for restaurants in Argentina & LATAM. All-in-one POS, Mercado Pago payments, UGC marketing, kitchen management. Try free.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preload LCP hero image with high priority -->
    <link rel="preload" as="image" href="/hero.webp" fetchpriority="high">

    <!-- DNS prefetch for 3rd party scripts -->
    <link rel="dns-prefetch" href="https://www.googletagmanager.com">
    <link rel="dns-prefetch" href="https://connect.facebook.net">

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Preload correct WOFF2 font files (v20 Inter, v15 Outfit — confirmed from Google Fonts API) -->
    <link rel="preload" as="font" type="font/woff2" href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa2JL7W0Q5n-wU.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="https://fonts.gstatic.com/s/outfit/v15/QGYvz_MVcBeNP4NJuktqUYLkn8BJ.woff2" crossorigin>

    <!-- Load font CSS non-blocking -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet"></noscript>

    <!-- Critical CSS: system font renders instantly before Google fonts arrive -->
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      h1, h2, h3, h4, h5, h6, .font-display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; }
    </style>

    <title>FoodSpot Mobile — The Shopify of the Food Industry</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "FoodSpot Mobile",
      "description": "The Shopify alternative for restaurants in Argentina & LATAM. All-in-one restaurant management system with Mercado Pago, UGC marketing, and AI.",
      "url": "https://www.foodspotmobile.com",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web, iOS, Android",
      "areaServed": ["AR", "BR", "MX", "CL", "CO", "PE"],
      "offers": {
        "@type": "Offer",
        "price": "25.99",
        "priceCurrency": "USD",
        "priceValidUntil": "2026-12-31"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "150"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      TRACKING SCRIPTS — Loaded via cookie consent (see CookieConsent.tsx).
      These are injected dynamically ONLY after the user accepts cookies.
      This fixes:
        - Best Practices: Facebook 3rd-party cookies penalty
        - Best Practices: Deprecated AttributionReporting API penalty
        - Performance: Scripts no longer block main thread on initial load
    -->
  </body>
</html>
