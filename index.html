<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Commission-free restaurant ordering platform. Full POS, AI analytics, marketing tools. Build your own restaurant app — keep 100% of sales.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preload LCP hero image with high priority -->
    <link rel="preload" as="image" href="/hero.webp" fetchpriority="high">

    <!-- DNS prefetch for 3rd party scripts -->
    <link rel="dns-prefetch" href="https://www.googletagmanager.com">
    <link rel="dns-prefetch" href="https://connect.facebook.net">

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Preload correct WOFF2 font files (v20 Inter, v15 Outfit — confirmed from Google Fonts API) -->
    <link rel="preload" as="font" type="font/woff2" href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa2JL7W0Q5n-wU.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="https://fonts.gstatic.com/s/outfit/v15/QGYvz_MVcBeNP4NJuktqUYLkn8BJ.woff2" crossorigin>

    <!-- Load font CSS non-blocking -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet"></noscript>

    <!-- Critical CSS: system font renders instantly before Google fonts arrive -->
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      h1, h2, h3, h4, h5, h6, .font-display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; }
    </style>

    <title>FoodSpot: Restaurant Ordering, POS & Marketing | AI-Powered</title>

    <!-- Open Graph tags for social sharing -->
    <meta property="og:title" content="FoodSpot Mobile — Restaurant Online Ordering & E-commerce Platform">
    <meta property="og:description" content="Commission-free restaurant online store. Digital menu, orders, payments, UGC marketing — all in one platform.">
    <meta property="og:image" content="https://www.foodspotmobile.com/hero.webp">
    <meta property="og:url" content="https://www.foodspotmobile.com">
    <meta property="og:type" content="website">

    <!-- Twitter Card tags -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="FoodSpot Mobile — Restaurant Online Ordering System">
    <meta property="twitter:description" content="Commission-free restaurant online store with AI-powered promotions and UGC marketing.">
    <meta property="twitter:image" content="https://www.foodspotmobile.com/hero.webp">

    <!-- Canonical URL -->
    <meta rel="canonical" href="https://www.foodspotmobile.com">

    <!-- Language alternates -->
    <link rel="alternate" hreflang="es" href="https://www.foodspotmobile.com?lang=es">
    <link rel="alternate" hreflang="en" href="https://www.foodspotmobile.com?lang=en">
    <link rel="alternate" hreflang="pt" href="https://www.foodspotmobile.com?lang=pt">
    <link rel="alternate" hreflang="x-default" href="https://www.foodspotmobile.com">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "FoodSpot Mobile",
      "description": "Commission-free restaurant online ordering system and e-commerce platform for restaurants in LATAM",
      "url": "https://www.foodspotmobile.com",
      "applicationCategory": ["BusinessApplication", "Ecommerce"],
      "operatingSystem": "Web, iOS, Android",
      "areaServed": ["AR", "BR", "MX", "CL", "CO", "PE"],
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "priceValidUntil": "2026-12-31",
        "description": "14-day free trial, no credit card required"
      },
      "featureList": [
        "Commission-free online store",
        "Digital menu builder",
        "Integrated payments (Mercado Pago)",
        "Inventory management",
        "Customer relationship management",
        "AI-powered promotions",
        "UGC marketing tools"
      ],
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "150"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      TRACKING SCRIPTS — Loaded via cookie consent (see CookieConsent.tsx).
      These are injected dynamically ONLY after the user accepts cookies.
      This fixes:
        - Best Practices: Facebook 3rd-party cookies penalty
        - Best Practices: Deprecated AttributionReporting API penalty
        - Performance: Scripts no longer block main thread on initial load
    -->
  </body>
</html>
